<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sonido Vivo - Registrarse</title>
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png">
    <link rel="manifest" href="image/site.webmanifest">

    <link rel="stylesheet" href="style/style.css">
    <script src="js/validacionSignin.js" defer></script>
</head>
<body>
    <header class="headerStyle">
        <h1 id="pageTitle">Sonido Vivo</h1>
        <p><a href="index.html">Click aquí para volver al inicio</a></p>
    </header>

    <main>
        <section class="auth-container">
            <h2>Registrarse</h2>
            <form id="form-sign-in">
                <label for="nombre-de-usuario">Nombre de usuario</label>
                <input type="text" id="nombre-de-usuario" name="nombre-de-usuario" placeholder="Ej: Juan Perez" autocomplete="username" required>
                <span class="error-texto" id="error-nombre-de-usuario"></span>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" autocomplete="email" required>
                <span class="error-texto" id="error-correo"></span>

                <label for="numero-de-telefono">Número de teléfono</label>
                <input type="tel" id="numero-de-telefono" name="numero-de-telefono" placeholder="+56912345678" autocomplete="tel" required>
                <span class="error-texto" id="error-numero-de-telefono"></span>

                <button type="submit">Registrar</button>
                <p id="mensajeConfirmacion"></p>
            </form>
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </section>
    </main>

    <footer class="footerStyle">
        <p>© 2026 Sonido Vivo - Viña del Mar, Chile</p>
    </footer>
</body>
</html>
