<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sonido Vivo - Iniciar Sesión</title>
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png">
    <link rel="manifest" href="image/site.webmanifest">
    
    <link rel="stylesheet" href="style/style.css">
    <script src="js/validacionLogin.js" defer></script>
</head>
<body>
    <header class="headerStyle">
        <h1 id="pageTitle">Sonido Vivo</h1>
        <p><a href="index.html">Click aqui para volver al inicio </a></p>
    </header>

    <main>
        <section class="auth-container">
            <h2>Inicio de sesión</h2>
            <form id="form-login">
                <label for="nombre-de-usuario">Nombre de usuario</label>
                <input type="text" id="nombre-de-usuario" name="nombre-de-usuario" placeholder="Diego Alvear" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>

                <button type="submit">Iniciar sesión</button>
                <p id="mensajeConfirmacion"></p>
            </form>
            <p>¿Aún no tienes una cuenta? <a href="registrarse.html">¡Haz clic aquí!</a></p>
        </section>
    </main>

    <footer class="footerStyle">
        <p>© 2026 Sonido Vivo - Viña del Mar, Chile</p>
    </footer>
</body>
</html>
