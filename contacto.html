<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sonido Vivo - Contacto</title>
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png">
    <link rel="manifest" href="image/site.webmanifest">

    <link rel="stylesheet" href="style/style.css">
    <script src="js/validacionContacto.js" defer></script>
</head>
<body>
    <header class="headerStyle">
        <h1 id="pageTitle">Sonido Vivo</h1>
        <p><a href="index.html">Click aquí para volver al inicio</a></p>
    </header>

    <main>
        <section class="auth-container">
            <h2>Contacto</h2>
            <p>¿Tienes dudas sobre algún producto o pedido? Escríbenos y te respondemos a la brevedad.</p>

            <form id="form-contacto">
                <label for="nombre-contacto">Nombre completo</label>
                <input type="text" id="nombre-contacto" name="nombre-contacto" placeholder="Ej: Juan Pérez" autocomplete="name" required>
                <span class="error-texto" id="error-nombre-contacto"></span>

                <label for="correo-contacto">Correo electrónico</label>
                <input type="email" id="correo-contacto" name="correo-contacto" placeholder="ejemplo@correo.com" autocomplete="email" required>
                <span class="error-texto" id="error-correo-contacto"></span>

                <label for="mensaje-contacto">Mensaje</label>
                <textarea id="mensaje-contacto" name="mensaje-contacto" placeholder="Escribe tu consulta aquí..." required></textarea>
                <span class="error-texto" id="error-mensaje-contacto"></span>

                <button type="submit">Enviar mensaje</button>
                <p id="mensajeConfirmacion"></p>
            </form>
        </section>
    </main>

    <footer class="footerStyle">
        <p>© 2026 Sonido Vivo - Viña del Mar, Chile</p>
    </footer>
</body>
</html>
